[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "validator-agent"
version = "0.1.0"
description = "Validator Agent (#12) — centralized content safety gate for AssessorFlow"
requires-python = ">=3.12"
dependencies = [
    "af_shared[langfuse]>=0.2.0",
    "fastapi==0.135.3",
    "uvicorn==0.44.0",
    "pydantic==2.12.5",
    "structlog==25.5.0",
    "pyyaml>=6.0",
    "google-cloud-pubsub>=2.0",
    # Thet's pipeline dependencies (integrated 2026-04-05)
    "google-cloud-documentai>=2.32.0",
    "google-cloud-storage>=2.19.0",
    "openai>=1.82.0",
    "pdf2image>=1.17.0",
    "pypdf>=6.9.2",
    "python-dotenv>=1.2.2",
    "requests>=2.32.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
postgres = [
    "asyncpg==0.31.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "mypy",
    "ruff",
    "asyncpg==0.31.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/validator_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
