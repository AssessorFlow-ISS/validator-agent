[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "validator-agent"
version = "0.1.0"
description = "Validator Agent (#12) — centralized content safety gate for AssessorFlow"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "structlog>=24.0",
    "google-cloud-pubsub>=2.0",
    # Pipeline dependencies (MRC + OCR + Content Safety)
    "google-cloud-documentai>=2.32.0",
    "google-cloud-storage>=2.19.0",
    "openai>=1.82.0",
    "pdf2image>=1.17.0",
    "pypdf>=6.9.2",
    "python-dotenv>=1.2.2",
    "requests>=2.32.0",
    "httpx>=0.27.0",
    # Phase 6C.1 — Submission Service gRPC (reads materials, writes validation decisions)
    "grpcio>=1.74.0",
    "grpcio-tools>=1.74.0",
    "protobuf>=5.29.0",
    "langfuse>=2.0",
]

[project.optional-dependencies]
postgres = [
    "asyncpg>=0.30.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0",
    "httpx>=0.27.0",
    "coverage>=7.0",
    "mypy",
    "ruff",
    "asyncpg>=0.30.0",
]
eval = [
    "deepeval>=2.0",
    "deepteam>=0.1",
    "fpdf2>=2.8",
    "pytest-html>=4.0",
]
audit = [
    "pip-audit>=2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["src/validator_agent"]
omit = [
    # Auto-generated gRPC stubs — regenerated from proto/, not hand-written
    "src/validator_agent/_grpc/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.hatch.build.targets.wheel]
packages = ["src/validator_agent"]

[tool.ruff]
# Exclude auto-generated gRPC stubs from linting -- regenerated from
# proto/submission.proto via grpc_tools.protoc and should not be hand-edited.
target-version = "py312"
line-length = 120
extend-exclude = ["src/validator_agent/_grpc"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E402", "E501", "N806", "UP042"]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
disable_error_code = ["attr-defined", "call-arg", "arg-type", "return-value", "no-any-return", "operator", "override", "misc", "import-untyped", "no-redef"]
