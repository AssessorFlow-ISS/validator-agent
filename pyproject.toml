[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "validator-agent"
version = "0.1.0"
description = "Validator Agent (#12) — centralized content safety gate for AssessorFlow"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "structlog>=24.0",
    # Thet's pipeline dependencies (integrated 2026-04-05)
    "google-cloud-documentai>=2.32.0",
    "google-cloud-storage>=2.19.0",
    "openai>=1.82.0",
    "pdf2image>=1.17.0",
    "pypdf>=6.9.2",
    "python-dotenv>=1.2.2",
    "requests>=2.32.0",
]

[project.optional-dependencies]
postgres = [
    "asyncpg>=0.30.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "coverage>=7.0",
    "asyncpg>=0.30.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.hatch.build.targets.wheel]
packages = ["src/validator_agent"]
