name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff Check
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Verify INTEGRATION_REPO_PAT secret
        run: |
          if [ -z "${{ secrets.INTEGRATION_REPO_PAT }}" ]; then
            echo "::error::The INTEGRATION_REPO_PAT secret is required to checkout the assessorflow/shared dependency. Please add it in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Checkout shared dependency
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: assessorflow/shared
          path: shared
          token: ${{ secrets.INTEGRATION_REPO_PAT }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Install af-shared
        run: uv pip install -e ./shared

      - name: Run Ruff check
        run: uv run ruff check src/ tests/

      - name: Check formatting
        run: uv run ruff format --check src/ tests/
