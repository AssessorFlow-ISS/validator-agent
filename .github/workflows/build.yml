name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  container:
    name: Build Container
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Verify INTEGRATION_REPO_PAT secret
        run: |
          if [ -z "${{ secrets.INTEGRATION_REPO_PAT }}" ]; then
            echo "::error::The INTEGRATION_REPO_PAT secret is required to checkout the assessorflow/shared dependency. Please add it in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Checkout shared dependency
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: assessorflow/shared
          path: shared
          token: ${{ secrets.INTEGRATION_REPO_PAT }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Build container
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: Containerfile
          build-contexts: |
            shared=./shared
          push: false
          load: true
          tags: validator-agent:test

      - name: Run security scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: validator-agent:test
          format: table
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
