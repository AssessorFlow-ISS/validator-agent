# ──────────────────────────────────────────────────────────────
# CI — Continuous Integration
#
# Sequential pipeline:
#   Stage 1: Code Quality + Security (parallel)
#   Stage 2: Automated Tests (unit + guardrail regression)
#   Stage 3: LLM Eval + Container Build (parallel)
#   Stage 4: CI Summary
# ──────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main, dev, test]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── Stage 1a: Code Quality ─────────────────────────────────
  code-quality:
    name: Code Quality — Ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --all-extras --dev

      - name: Ruff check
        run: uv run ruff check src/ tests/

      - name: Ruff format
        run: uv run ruff format --check src/ tests/

      - name: mypy
        run: uv run mypy src/.

  # ── Stage 1b: Security — SCA + Secrets + CI ────────────────
  security-sca:
    name: Security — pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --all-extras --dev

      - name: Export requirements
        run: uv export --no-dev --no-emit-project > requirements.txt

      - name: pip-audit (SCA)
        run: uv run pip-audit --requirement=requirements.txt --desc

  security-secrets:
    name: Security — TruffleHog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: TruffleHog
        uses: trufflesecurity/trufflehog@3fc0c2aa6648d54242e4af6fbfde0701796e4fb0
        with:
          extra_args: --exclude-detectors=Postgres

  security-zizmor:
    name: Security — zizmor (GHA audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - name: zizmor
        uses: zizmorcore/zizmor-action@b1d7e1fb5de872772f31590499237e7cce841e8e
        with:
          advanced-security: false

  # ── Stage 2: Automated Tests ───────────────────────────────
  automated-tests:
    name: Automated — pytest + coverage
    needs: [code-quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --all-extras --dev

      - name: Unit + Integration Tests (80% coverage gate)
        run: uv run pytest tests/ -v --ignore=tests/eval --ignore=tests/golden --cov=validator_agent --cov-report=xml --cov-fail-under=80

      - name: Guardrail Regression (60 tests)
        run: uv run pytest tests/test_guardrails.py -v

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@18283e04ce6e62d37312384ff67231eb8fd56d24 # v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # ── Stage 3a: LLM Eval ─────────────────────────────────────
  llm-deepeval:
    name: LLM — DeepEval quality
    needs: [automated-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --all-extras --dev

      - name: DeepEval Smoke (6 cases, 4 metrics)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CONFIDENT_API_KEY: ${{ secrets.CONFIDENT_API_KEY }}
        run: uv run --extra eval deepeval test run tests/eval/test_deepeval.py -k "smoke"

  llm-promptfoo:
    name: LLM — Promptfoo OWASP
    needs: [automated-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642195b5e65ec0cc5acb848 # v4
        with:
          node-version: '20'

      - name: Promptfoo OWASP Red Team (10 cases)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cd tests/eval
          npx promptfoo eval

  # ── Stage 3b: Container ────────────────────────────────────
  container:
    name: Container — Docker build + Trivy scan
    needs: [automated-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3

      - name: Build container
        uses: docker/build-push-action@14487ce63c7a62a85a2a2a5572fe4f8cb8d45e13 # v6
        with:
          context: .
          file: Containerfile
          push: false
          load: true
          tags: validator-agent:test

      - name: Trivy scan (CRITICAL + HIGH = fail)
        uses: aquasecurity/trivy-action@76071ef0d7ec797419534a183b498b4d6366b4a0 # v0.35.0
        with:
          image-ref: validator-agent:test
          format: table
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  # ── Stage 4: CI Summary ────────────────────────────────────
  ci-summary:
    name: CI Summary
    needs: [security-sca, security-secrets, security-zizmor, llm-deepeval, llm-promptfoo, container]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          echo "=== CI Pipeline Summary ==="
          echo "Security SCA:     ${{ needs.security-sca.result }}"
          echo "Security Secrets: ${{ needs.security-secrets.result }}"
          echo "Security zizmor:  ${{ needs.security-zizmor.result }}"
          echo "DeepEval:         ${{ needs.llm-deepeval.result }}"
          echo "Promptfoo:        ${{ needs.llm-promptfoo.result }}"
          echo "Container:        ${{ needs.container.result }}"
          echo "=========================="
