# ──────────────────────────────────────────────────────────────
# Security Scan — Weekly scheduled scan
#
# Catches newly disclosed CVEs in dependencies and newly leaked
# secrets even when no code changes. Runs every Tuesday 11am SGT.
# ──────────────────────────────────────────────────────────────
name: Security Scan (Weekly)

on:
  schedule:
    - cron: "0 3 * * 2"  # Every Tuesday 11am SGT (UTC+8)
  workflow_dispatch:       # Manual trigger

permissions:
  contents: read

jobs:
  sca:
    name: SCA — pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5

      - run: uv sync --all-extras --dev

      - name: Export locked requirements
        run: uv export --no-dev --no-emit-project > requirements.txt

      - name: pip-audit
        run: uv run pip-audit --requirement=requirements.txt --desc

  secret-scanning:
    name: Secret Scanning — trufflehog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: trufflehog
        uses: trufflesecurity/trufflehog@3fc0c2aa6648d54242e4af6fbfde0701796e4fb0
        with:
          extra_args: --exclude-detectors=Postgres,SentryToken

