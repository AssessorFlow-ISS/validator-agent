# ──────────────────────────────────────────────────────────────
# Security Scan — Weekly scheduled scan
#
# Catches newly disclosed CVEs in dependencies and newly leaked
# secrets even when no code changes. Runs every Tuesday 10am SGT.
# ──────────────────────────────────────────────────────────────
name: Security Scan (Weekly)

on:
  schedule:
    - cron: "0 2 * * 2"  # Every Tuesday 10am SGT (UTC+8)
  workflow_dispatch:       # Manual trigger

permissions:
  contents: read

jobs:
  sca:
    name: SCA — pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - run: uv sync --all-extras --dev

      - name: Export locked requirements
        run: uv export --no-dev --no-emit-project > requirements.txt

      - name: pip-audit
        run: uv run pip-audit --requirement=requirements.txt --desc

  secret-scanning:
    name: Secret Scanning — trufflehog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: trufflehog
        uses: trufflesecurity/trufflehog@3fc0c2aa6648d54242e4af6fbfde0701796e4fb0
        with:
          extra_args: --exclude-detectors=Postgres

  workflow-security:
    name: Workflow Security — zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - name: zizmor
        uses: zizmorcore/zizmor-action@b1d7e1fb5de872772f31590499237e7cce841e8e
        with:
          advanced-security: false
