name: llmsecops-ci (validator-agent)

# Validator-agent-scoped LLMOps test trigger. On push to this repo, we
# invoke the central af-llmsecops packaged-CI workflow with
# target_agent pinned — so ONLY the validator-agent-relevant test cells
# fan out into af-golden. The per-agent scoping gate lives in
# af-llmsecops/af_llmsecops/catalog/schema.py (Pydantic Applicability
# enum) — this file just tells the central workflow which agent we are.
#
# See also LLMSECOPS_ARCHITECTURE.md Section 10.11 (worked example).

on:
  push:
    branches: [main, feat/thet-integration]
  pull_request:
    branches: [main, feat/thet-integration]
  workflow_dispatch:

jobs:
  validator-agent-llmsecops:
    name: validator-agent — LLMOps packaged CI
    uses: assessorflow/af-llmsecops/.github/workflows/llmsecops-ci.yml@feat/thet-integration
    # Required for the called workflow to mint OIDC tokens (WIF auth
    # into GCP). Without this the packaged-push + oplus-hydrate jobs
    # fail at the google-github-actions/auth step.
    permissions:
      contents: read
      id-token: write
    with:
      target_agent: validator-agent
    secrets: inherit
